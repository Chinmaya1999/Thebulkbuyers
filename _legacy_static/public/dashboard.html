<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — The Bulk Buyers</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/dashboard.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23ff5a2c'/%3E%3Cpath d='M16 12l-8 6 4 6 4-2v16h16V22l4 2 4-6-8-6c-1 3-4 5-8 5s-7-2-8-5z' fill='%23120600'/%3E%3C/svg%3E">
</head>
<body class="dash">
<div id="boot" style="min-height:100svh;display:grid;place-items:center;color:var(--muted)">Loading your workspace…</div>
<div class="shell" id="shell" hidden>
  <aside class="side">
    <a href="/" class="logo"><svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="currentColor" style="color:var(--accent)"/><path d="M16 12l-8 6 4 6 4-2v16h16V22l4 2 4-6-8-6c-1 3-4 5-8 5s-7-2-8-5z" fill="#0a0a0c"/></svg><span>The Bulk Buyers</span></a>
    <span class="rolebadge" id="rolebadge"></span>
    <nav class="snav" id="snav"></nav>
    <div class="me"><div class="avatar" id="av"></div><div><b id="me-name"></b><small id="me-mail"></small></div><button id="logout" title="Sign out" aria-label="Sign out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
  </aside>
  <div class="main">
    <div class="top"><button class="iconbtn menu-btn" id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="title"></h1><div class="sp"></div>
      <a class="b" href="/shop">Catalogue</a>
      <div style="position:relative"><button class="iconbtn" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot" id="bell-n" hidden></span></button><div class="notif" id="notif" hidden></div></div></div>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
