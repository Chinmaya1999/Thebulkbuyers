<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — The Bulk Buyers</title>
<meta name="description" content="Create account to your The Bulk Buyers account.">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23ff5a2c'/%3E%3Cpath d='M16 12l-8 6 4 6 4-2v16h16V22l4 2 4-6-8-6c-1 3-4 5-8 5s-7-2-8-5z' fill='%23120600'/%3E%3C/svg%3E">
</head>
<body data-page="register" class="authbody">
<header id="nav"></header>
<main class="auth"><canvas id="auth-canvas"></canvas><div class="auth-card wide"><span class="eyebrow">Join free</span><h1 class="h2" style="margin:12px 0 22px;font-size:clamp(34px,4vw,48px)">Create your account</h1>
<div class="roles" id="roles" role="tablist"><button type="button" data-role="buyer" class="on"><b>Buyer</b><small>Source garments in bulk</small></button><button type="button" data-role="seller"><b>Seller</b><small>List &amp; quote as manufacturer</small></button><button type="button" data-role="agent"><b>Agent</b><small>Refer &amp; earn commission</small></button></div>
<form class="form" id="reg-form" style="margin-top:20px"><div class="row2"><label>Full name<input name="name" required maxlength="80" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label></div>
<div class="row2"><label>Company<input name="company" maxlength="120" autocomplete="organization"></label><label>Phone<input name="phone" autocomplete="tel"></label></div>
<div class="row2"><label>Country<input name="country" value="India"></label><label id="gst-l">GST / Tax ID (optional)<input name="gst" maxlength="30"></label></div>
<div class="row2"><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="8+ chars, letters &amp; numbers"></label><label>Referral code (optional)<input name="ref" maxlength="20" placeholder="TBBXXXXXX"></label></div>
<p class="muted" id="role-note" style="font-size:13px"></p><div class="form-err" id="err" role="alert"></div><button class="btn btn-primary" type="submit">Create account</button></form>
<p class="muted" style="margin-top:22px;font-size:14px">Already registered? <a href="/login" style="color:var(--accent);font-weight:700">Sign in</a></p></div></main>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
