<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — The Bulk Buyers</title>
<meta name="description" content="Talk to The Bulk Buyers about bulk garment sourcing, private label and supplier onboarding.">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23ff5a2c'/%3E%3Cpath d='M16 12l-8 6 4 6 4-2v16h16V22l4 2 4-6-8-6c-1 3-4 5-8 5s-7-2-8-5z' fill='%23120600'/%3E%3C/svg%3E">
</head>
<body data-page="contact">
<header id="nav"></header>
<section class="phero"><canvas id="phero-canvas"></canvas><div class="wrap"><div class="crumbs"><a href="/">Home</a> / Contact</div><h1 class="h1 split" style="font-size:clamp(44px,7vw,100px)">Let's talk <em>bulk</em></h1><p class="lead">Questions about sourcing, private label or listing your factory? We reply within one business day.</p></div></section>
<section class="section"><div class="wrap split2">
  <div><h2 class="h3">Reach us directly</h2><ul class="list"><li><span id="c-phone"></span></li><li><span id="c-mail"></span></li><li><span id="c-addr"></span></li></ul></div>
  <div class="panel"><form class="form" id="contact-form">
    <div class="row2"><label>Name<input name="name" required maxlength="80" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label></div>
    <div class="row2"><label>Phone<input name="phone" autocomplete="tel"></label><label>Company<input name="company" autocomplete="organization"></label></div>
    <label>Message<textarea name="message" rows="5" required minlength="5" maxlength="2000" placeholder="Tell us what you're looking for — styles, quantities, timeline."></textarea></label>
    <button class="btn btn-primary" type="submit">Send message</button><div class="ok-msg" id="c-ok">Thank you — we've received your message and will reply soon.</div>
  </form></div>
</div></section>
<footer id="foot"></footer>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
