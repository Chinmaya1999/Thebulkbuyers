<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue — Wholesale Garments & Apparel | The Bulk Buyers</title>
<meta name="description" content="Browse wholesale T-shirts, hoodies, denim, shirts, jackets, womenswear, workwear and activewear from verified Indian manufacturers.">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23ff5a2c'/%3E%3Cpath d='M16 12l-8 6 4 6 4-2v16h16V22l4 2 4-6-8-6c-1 3-4 5-8 5s-7-2-8-5z' fill='%23120600'/%3E%3C/svg%3E">
</head>
<body data-page="shop">
<header id="nav"></header>
<section class="phero"><canvas id="phero-canvas"></canvas><div class="wrap"><div class="crumbs"><a href="/">Home</a> / Catalogue</div><h1 class="h1 split" style="font-size:clamp(44px,7vw,100px)">Wholesale <em>catalogue</em></h1><p class="lead">Filter by category, MOQ and price. Found a style? Request a quote in one click.</p></div></section>
<section class="section" style="padding-top:60px"><div class="wrap market">
  <aside class="filters">
    <div><h4>Search</h4><input id="f-q" type="search" placeholder="Hoodie, denim, cotton…"></div>
    <div><h4>Category</h4><div class="fopt" id="f-cats"></div></div>
    <div><h4>Max MOQ</h4><select id="f-moq"><option value="">Any</option><option value="200">Up to 200 pcs</option><option value="300">Up to 300 pcs</option><option value="500">Up to 500 pcs</option></select></div>
    <div><h4>Max price / pc: <span id="f-pv">Any</span></h4><input id="f-price" type="range" min="0" max="1500" step="50" value="0"></div>
  </aside>
  <div><div class="toolbar"><span class="muted" id="count">Loading…</span><select id="f-sort"><option value="">Featured</option><option value="popular">Most viewed</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="moq">Lowest MOQ</option><option value="new">Newest</option></select></div>
  <div class="pgrid" id="grid"></div><p class="center" style="margin-top:40px"><button class="btn btn-ghost" id="more" hidden>Load more</button></p></div>
</div></section>
<footer id="foot"></footer>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
