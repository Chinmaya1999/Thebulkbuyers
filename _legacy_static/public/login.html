<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="login" class="authbody">
<header id="nav"></header>
<main class="auth"><canvas id="auth-canvas"></canvas><div class="auth-card"><span class="eyebrow">Welcome back</span><h1 class="h2" style="margin:12px 0 26px;font-size:clamp(34px,4vw,48px)">Sign in</h1>
<form class="form" id="login-form"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><div class="form-err" id="err" role="alert"></div><button class="btn btn-primary" type="submit">Sign in</button></form>
<p class="muted" style="margin-top:22px;font-size:14px">New here? <a href="/register" style="color:var(--accent);font-weight:700">Create an account</a></p></div></main>
<script src="/js/app.js"></script>
<script src="/js/pages.js"></script>
</body>
</html>
