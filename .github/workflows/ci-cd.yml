name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thebulkbuyers

jobs:
  # 1) Install dependencies (server + client), build the client, run API tests against a real Postgres
  test:
    name: Install, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tbb, POSTGRES_PASSWORD: tbb, POSTGRES_DB: bulkbuyers }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tbb -d bulkbuyers" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build client
        run: npm run build --prefix client
      - name: Start API (demo data, relaxed rate limits)
        env:
          DATABASE_URL: postgres://tbb:tbb@localhost:5432/bulkbuyers
          NODE_ENV: development
          SEED_DEMO: "true"
          ADMIN_PASSWORD: Admin@12345
          JWT_SECRET: ci-only-secret
          API_LIMIT: "5000"
          LOGIN_LIMIT: "500"
          REGISTER_LIMIT: "500"
        run: |
          nohup node server/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:3000/healthz && exit 0
            sleep 2
          done
          echo "API did not become healthy"; cat server.log; exit 1
      - name: Run tests
        env:
          BASE: http://localhost:3000
          ADMIN_PASSWORD: Admin@12345
        run: npm test
      - name: Show API log on failure
        if: failure()
        run: cat server.log || true

  # 2) Build the Docker image and push it to Docker Hub
  build-push:
    name: Build & push Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Log in to the EC2 server, install what's required, and deploy
  deploy:
    name: Deploy to EC2
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName ${{ secrets.EC2_HOST }}
            User ${{ secrets.EC2_USER }}
            IdentityFile ~/.ssh/deploy.pem
            ServerAliveInterval 30
          EOF
      - name: Install server prerequisites (Docker, compose, swap)
        run: |
          ssh ec2 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v docker >/dev/null; then
            sudo dnf install -y docker
            sudo systemctl enable --now docker
            sudo usermod -aG docker "$USER"
          fi
          sudo systemctl start docker
          if ! docker compose version >/dev/null 2>&1 && ! sudo docker compose version >/dev/null 2>&1; then
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          # small instance (<1GB RAM): add 2GB swap once
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile
            sudo mkswap /swapfile && sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          fi
          mkdir -p ~/thebulkbuyers
          REMOTE
      - name: Upload compose file and environment
        run: |
          scp deploy/docker-compose.prod.yml ec2:thebulkbuyers/docker-compose.yml
          umask 077
          printf '%s\n' "${{ secrets.PROD_ENV_FILE }}" > prod.env
          echo "APP_IMAGE=${IMAGE}:${GITHUB_SHA}" >> prod.env
          scp prod.env ec2:thebulkbuyers/.env
          rm -f prod.env
      - name: Pull image and restart
        run: |
          ssh ec2 'bash -s' <<REMOTE
          set -euo pipefail
          cd ~/thebulkbuyers
          echo '${{ secrets.DOCKERHUB_TOKEN }}' | sudo docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
          sudo docker image prune -f
          sudo docker logout
          REMOTE
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs "http://${{ secrets.EC2_HOST }}/healthz"; then echo; echo "Deployed ${GITHUB_SHA}"; exit 0; fi
            sleep 4
          done
          echo "Health check failed - server logs:"
          ssh ec2 'cd ~/thebulkbuyers && sudo docker compose ps && sudo docker compose logs --tail=80'
          exit 1
